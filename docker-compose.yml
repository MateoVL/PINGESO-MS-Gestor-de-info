services:
  mongodb:
    image: mongo:8.0
    container_name: gestor_info_mongo_dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-gestor_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev-admin-password}
      MONGO_DATABASE: ${MONGO_DATABASE:-gestor_info_db}
      MONGO_USER: ${MONGO_USER:-gestor_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-dev-gestor-password}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_dev_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host mongodb --username "$$MONGO_USER" --password "$$MONGO_PASSWORD"
          --authenticationDatabase "$$MONGO_DATABASE" --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 4s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - gestor_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gestor_info_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      GIN_MODE: ${GIN_MODE:-debug}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-gestor_info_db}
      MONGO_USER: ${MONGO_USER:-gestor_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-dev-gestor-password}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:8081}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:8082}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SERVICE_ROLE: ${SERVICE_ROLE:-}
      SERVICE_DEPENDS_ON: ${SERVICE_DEPENDS_ON:-}
      SERVICE_CONSUMERS: ${SERVICE_CONSUMERS:-}
      SERVICE_CAPABILITIES: ${SERVICE_CAPABILITIES:-}
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gestor_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gestor_info_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - gestor_net

volumes:
  mongo_dev_data:

networks:
  gestor_net:
    driver: bridge
