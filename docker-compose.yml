services:
  postgres:
    image: postgres:16-alpine
    container_name: gestor_info_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gestor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestor_password}
      POSTGRES_DB: ${DB_NAME:-gestor_info_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestor_user} -d ${DB_NAME:-gestor_info_db}"]
      interval: 4s
      timeout: 5s
      retries: 6
    networks:
      - gestor_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gestor_info_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      GIN_MODE: ${GIN_MODE:-debug}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gestor_user}
      DB_PASSWORD: ${DB_PASSWORD:-gestor_password}
      DB_NAME: ${DB_NAME:-gestor_info_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:8081}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:8082}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gestor_info_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - gestor_net

volumes:
  postgres_dev_data:

networks:
  gestor_net:
    driver: bridge
