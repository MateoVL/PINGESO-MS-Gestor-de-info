services:
  postgres:
    image: postgres:16-alpine
    container_name: gestor_info_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestor_net_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor_info_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL}
      MS_REPORTES_URL: ${MS_REPORTES_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: gestor_info_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - gestor_net_prod

volumes:
  postgres_prod_data:

networks:
  gestor_net_prod:
    driver: bridge
