name: ms-gestor-de-info

services:
  postgres:
    image: postgres:17.11
    container_name: gestor_info_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gestor_net_prod

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    container_name: gestor_info_migrate_prod
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Define POSTGRES_USER}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gestor_info_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net_prod

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gestor_info_backend_prod
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5121}:8080"
    environment:
      APP_ENV: production
      API_ENV: production
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5120,http://127.0.0.1:5120,http://localhost:3000,http://127.0.0.1:3000}
      POSTGRES_URI: postgres://postgres:5432/${POSTGRES_DB:-gestor_info_db}?sslmode=disable
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:5151}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:5111}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_ROLE: ${SERVICE_ROLE:-}
      SERVICE_DEPENDS_ON: ${SERVICE_DEPENDS_ON:-}
      SERVICE_CONSUMERS: ${SERVICE_CONSUMERS:-}
      SERVICE_CAPABILITIES: ${SERVICE_CAPABILITIES:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - gestor_net_prod

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gestor_info_frontend_prod
    restart: always
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:8080"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5120}:8080"
    depends_on:
      - backend
    networks:
      - gestor_net_prod

volumes:
  postgres_prod_data:

networks:
  gestor_net_prod:
    driver: bridge
