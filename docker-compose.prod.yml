services:
  postgres:
    image: postgres:17-alpine
    container_name: gestor_info_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gestor_net_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor_info_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      POSTGRES_URI: postgres://postgres:5432/${POSTGRES_DB:-gestor_info_db}?sslmode=disable
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:8081}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:8082}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SERVICE_ROLE: ${SERVICE_ROLE:-}
      SERVICE_DEPENDS_ON: ${SERVICE_DEPENDS_ON:-}
      SERVICE_CONSUMERS: ${SERVICE_CONSUMERS:-}
      SERVICE_CAPABILITIES: ${SERVICE_CAPABILITIES:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: gestor_info_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - gestor_net_prod

volumes:
  postgres_prod_data:

networks:
  gestor_net_prod:
    driver: bridge
