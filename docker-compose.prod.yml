services:
  mongodb:
    image: mongo:8.0
    container_name: gestor_info_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Define MONGO_ROOT_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-gestor_info_db}
      MONGO_USER: ${MONGO_USER:?Define MONGO_USER en .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
    volumes:
      - mongo_prod_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host mongodb --username "$$MONGO_USER" --password "$$MONGO_PASSWORD"
          --authenticationDatabase "$$MONGO_DATABASE" --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gestor_net_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor_info_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-gestor_info_db}
      MONGO_USER: ${MONGO_USER:?Define MONGO_USER en .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:8081}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:8082}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gestor_net_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: gestor_info_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - gestor_net_prod

volumes:
  mongo_prod_data:

networks:
  gestor_net_prod:
    driver: bridge
