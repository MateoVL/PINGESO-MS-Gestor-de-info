services:
  postgres:
    image: postgres:17.11
    container_name: gestor_info_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:-gestor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-gestor-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 4s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - gestor_net

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.migrate
    container_name: gestor_info_migrate_dev
    command:
      - "postgres://${POSTGRES_USER:-gestor_user}:${POSTGRES_PASSWORD:-dev-gestor-password}@postgres:5432/${POSTGRES_DB:-gestor_info_db}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: gestor_info_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_ENV: ${API_ENV:-dev}
      APP_NAME: ${APP_NAME:-MS Gestor de Información}
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      POSTGRES_URI: postgres://postgres:5432/${POSTGRES_DB:-gestor_info_db}?sslmode=disable
      POSTGRES_DB: ${POSTGRES_DB:-gestor_info_db}
      POSTGRES_USER: ${POSTGRES_USER:-gestor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-gestor-password}
      MS_DIGITALIZACION_URL: ${MS_DIGITALIZACION_URL:-http://localhost:8081}
      MS_REPORTES_URL: ${MS_REPORTES_URL:-http://localhost:8082}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_ROLE: ${SERVICE_ROLE:-}
      SERVICE_DEPENDS_ON: ${SERVICE_DEPENDS_ON:-}
      SERVICE_CONSUMERS: ${SERVICE_CONSUMERS:-}
      SERVICE_CAPABILITIES: ${SERVICE_CAPABILITIES:-}
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestor_net

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: gestor_info_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    volumes:
      - ./apps/web:/workspace/apps/web
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    depends_on:
      - backend
    networks:
      - gestor_net

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: gestor_info_mailpit_dev
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - gestor_net

volumes:
  postgres_dev_data:

networks:
  gestor_net:
    driver: bridge

